name: Setup Android Build Environment
description: Install Java, Gradle, and the Android SDK for Android release builds.

runs:
  using: composite
  steps:
    - name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Install Android SDK components
      shell: bash
      run: |
        set +e
        yes | sdkmanager --licenses
        license_status="${PIPESTATUS[1]}"
        set -e

        if [[ "${license_status}" -ne 0 ]]; then
          exit "${license_status}"
        fi

        compile_sdk="$(awk -F= '/^ANDROID_COMPILE_SDK=/{print $2; exit}' gradle.properties)"
        build_tools="$(awk -F= '/^ANDROID_BUILD_TOOLS=/{print $2; exit}' gradle.properties)"
        test -n "${compile_sdk}" && test -n "${build_tools}"

        platform_sdk="${compile_sdk}"
        if (( compile_sdk >= 37 )); then
          platform_sdk="${compile_sdk}.0"
        fi

        sdkmanager \
          "platform-tools" \
          "platforms;android-${platform_sdk}" \
          "build-tools;${build_tools}"

    - name: Make Gradle wrapper executable
      shell: bash
      run: chmod +x ./gradlew
